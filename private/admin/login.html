<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WebQuake Admin — Login</title>
<style>
    * { box-sizing: border-box; }
    body {
        margin: 0;
        font-family: -apple-system, Segoe UI, Roboto, sans-serif;
        background: #0f1115;
        color: #e6e6e6;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
    }
    form {
        background: #1a1d24;
        padding: 2rem;
        border-radius: 8px;
        width: 280px;
        box-shadow: 0 4px 24px rgba(0,0,0,0.4);
    }
    h1 { margin: 0 0 1rem; font-size: 1.2rem; }
    input {
        width: 100%;
        padding: 0.6rem;
        margin-bottom: 1rem;
        border-radius: 4px;
        border: 1px solid #333;
        background: #0f1115;
        color: #e6e6e6;
    }
    button {
        width: 100%;
        padding: 0.6rem;
        border: none;
        border-radius: 4px;
        background: #3b82f6;
        color: white;
        font-weight: 600;
        cursor: pointer;
    }
    button:hover { background: #2563eb; }
    .error { color: #f87171; font-size: 0.85rem; margin-bottom: 1rem; min-height: 1em; }
</style>
</head>
<body>
<form id="login-form">
    <h1>WebQuake Admin</h1>
    <input type="password" id="password" placeholder="Password" autofocus required>
    <div class="error" id="error"></div>
    <button type="submit">Log in</button>
</form>
<script>
document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const password = document.getElementById('password').value;
    const errorEl = document.getElementById('error');
    errorEl.textContent = '';
    try {
        const res = await fetch('/api/admin/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ password }),
        });
        const data = await res.json();
        if (data.ok) {
            window.location.href = '/admin';
        } else {
            errorEl.textContent = data.error || 'Login failed';
        }
    } catch (err) {
        errorEl.textContent = 'Request failed: ' + err;
    }
});
</script>
</body>
</html>
